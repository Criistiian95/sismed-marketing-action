openapi: 3.1.0
info:
  title: Sismed Marketing API
  version: 3.3.0
servers:
  - url: https://sismed-marketing-action.onrender.com
paths:
  /api/imagenes/generar:
    post:
      operationId: generarImagenMarketing
      summary: Generar publicidad visual para Sismed con texto exacto en español
      description: >
        Genera un fondo visual con IA sin texto y luego agrega titular, subtítulo,
        beneficios y CTA de forma determinística. Usar esta acción para imágenes
        destinadas a Instagram o marketing.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt, title]
              properties:
                prompt:
                  type: string
                  maxLength: 2048
                  description: Descripción visual del fondo. No incluir instrucciones para renderizar texto.
                title:
                  type: string
                  maxLength: 180
                subtitle:
                  type: string
                  maxLength: 320
                bullets:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 140
                cta:
                  type: string
                  maxLength: 80
                  default: Escribinos por privado
                size:
                  type: string
                  default: 1024x1280
                quality:
                  type: string
                  enum: [low, medium, high, auto]
                  default: high
      responses:
        '201': { description: Imagen generada y alojada }

  /api/imagenes:
    get:
      operationId: listarImagenesMarketing
      summary: Listar imágenes generadas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Lista de imágenes }

  /api/instagram/status:
    get:
      operationId: verificarInstagram
      summary: Verificar conexión con Instagram
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Estado de conexión }

  /api/instagram/publicar-imagen:
    post:
      operationId: publicarImagenInstagram
      summary: Publicar inmediatamente una imagen aprobada
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_url]
              properties:
                image_url: { type: string, format: uri }
                caption: { type: string, maxLength: 2200 }
      responses:
        '201': { description: Imagen publicada }

  /api/instagram/programaciones:
    post:
      operationId: programarPublicacionInstagram
      summary: Programar una imagen pública
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_url, scheduled_at]
              properties:
                image_url: { type: string, format: uri }
                caption: { type: string, maxLength: 2200 }
                scheduled_at: { type: string, format: date-time }
      responses:
        '201': { description: Programación creada }
    get:
      operationId: listarPublicacionesInstagram
      summary: Listar publicaciones
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [programada, procesando, publicada, error]
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Lista de publicaciones }

  /api/instagram/generar-y-programar:
    post:
      operationId: generarYProgramarInstagram
      summary: Generar publicidad con texto exacto y programarla en Instagram
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt, title, scheduled_at]
              properties:
                prompt:
                  type: string
                  maxLength: 2048
                title:
                  type: string
                  maxLength: 180
                subtitle:
                  type: string
                  maxLength: 320
                bullets:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 140
                cta:
                  type: string
                  maxLength: 80
                  default: Escribinos por privado
                caption:
                  type: string
                  maxLength: 2200
                scheduled_at:
                  type: string
                  format: date-time
                size:
                  type: string
                  default: 1024x1280
                quality:
                  type: string
                  enum: [low, medium, high, auto]
                  default: high
      responses:
        '201': { description: Imagen generada y programación creada }

  /api/instagram/programaciones/{id}/publicar:
    post:
      operationId: publicarProgramacionInstagram
      summary: Publicar manualmente una programación
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Publicación realizada }

  /api/prospectos:
    post:
      operationId: crearProspecto
      summary: Registrar un prospecto
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_consultorio]
              properties:
                nombre_consultorio: { type: string }
                ciudad: { type: string }
                contacto_nombre: { type: string }
                canal: { type: string }
                contacto: { type: string }
                fuente: { type: string }
                estado: { type: string }
                notas: { type: string }
                proxima_accion: { type: string }
                fecha_proxima_accion: { type: string, format: date-time }
      responses:
        '201': { description: Prospecto creado }
    get:
      operationId: listarProspectos
      summary: Listar prospectos
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Lista de prospectos }

  /api/prospectos/{id}:
    patch:
      operationId: actualizarProspecto
      summary: Actualizar prospecto
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Prospecto actualizado }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
