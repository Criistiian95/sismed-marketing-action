services:
  - type: web
    name: sismed-marketing-action
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ACTION_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sismed-marketing-db
          property: connectionString

databases:
  - name: sismed-marketing-db
    plan: free
