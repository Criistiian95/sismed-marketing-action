openapi: 3.1.0
info:
  title: Sismed Marketing API
  version: 3.5.0
  description: 'API para prospectos, imágenes de marketing y publicaciones de Instagram
    de Sismed. Nunca debe almacenar datos clínicos ni datos de pacientes.

    '
servers:
- url: https://sismed-marketing-action.onrender.com
paths:
  /api/prospectos:
    post:
      operationId: crearProspecto
      summary: Registrar un nuevo consultorio potencial
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoProspecto'
      responses:
        '201':
          description: Prospecto creado
    get:
      operationId: listarProspectos
      summary: Listar prospectos comerciales
      security:
      - bearerAuth: []
      parameters:
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/Estado'
      - name: limite
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Lista de prospectos
  /api/prospectos/{id}:
    patch:
      operationId: actualizarProspecto
      summary: Actualizar un prospecto
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizacionProspecto'
      responses:
        '200':
          description: Prospecto actualizado
  /api/imagenes/generar:
    post:
      operationId: generarImagenMarketing
      summary: Generar publicidad de Sismed con modo económico o premium y texto exacto
      description: 'Genera el fondo visual con IA y agrega titular, subtítulo, beneficios
        y CTA de forma determinística. Devuelve una URL pública lista para Instagram.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request_id
              - prompt
              - title
              properties:
                prompt:
                  type: string
                  maxLength: 2048
                  description: Descripción visual del fondo. No pedir texto dentro
                    de la imagen.
                title:
                  type: string
                  maxLength: 180
                subtitle:
                  type: string
                  maxLength: 320
                bullets:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 140
                cta:
                  type: string
                  maxLength: 80
                  default: Pedí información
                size:
                  type: string
                  default: 1024x1280
                  description: Formato 4:5 para Instagram.
                  enum:
                  - 1024x1280
                quality:
                  type: string
                  enum:
                  - low
                  - medium
                  - high
                  - auto
                  default: medium
                mode:
                  type: string
                  enum:
                  - economy
                  - premium
                  default: economy
                  description: economy usa FLUX.1 Schnell; premium usa Lucid Origin.
                request_id:
                  type: string
                  minLength: 16
                  maxLength: 100
                  pattern: ^[a-zA-Z0-9_-]+$
                  description: Clave única por pedido. Reutilizar clave y datos ante
                    reintentos; no crear otra ante timeout.
      responses:
        '200':
          description: Imagen y URL pública
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  imagen:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        format: uri
                      size:
                        type: string
                      model:
                        type: string
                      quality:
                        type: string
        '201':
          description: Imagen y URL pública
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  imagen:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        format: uri
                      size:
                        type: string
                      model:
                        type: string
                      quality:
                        type: string
        '409':
          description: Intento pendiente/fallido o imagen antigua sin fondo
        '422':
          description: Texto demasiado largo para composición legible
        '502':
          description: Generación no confirmada; revisar antes de repetir
  /api/imagenes:
    get:
      operationId: listarImagenesMarketing
      summary: Listar imágenes de marketing generadas
      security:
      - bearerAuth: []
      parameters:
      - name: limite
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Lista de imágenes
  /api/instagram/status:
    get:
      operationId: verificarInstagram
      summary: Verificar conexión con Instagram
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado de conexión
  /api/instagram/publicar-imagen:
    post:
      operationId: publicarImagenInstagram
      summary: Publicar ahora una pieza aprobada
      description: Ante timeout consultar el mismo id; nunca crear otra pieza para
        reintentar.
      x-openai-isConsequential: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado real de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publicacion'
        '400':
          description: Datos inválidos
        '409':
          description: Versión desactualizada, sin aprobación u operación ocupada
        '502':
          description: Resultado incierto; consultar antes de repetir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - publication_id
              - revision
              properties:
                publication_id:
                  type: integer
                  minimum: 1
                revision:
                  type: integer
                  minimum: 1
  /api/instagram/programaciones:
    post:
      operationId: programarPublicacionInstagram
      summary: Programar o reprogramar una pieza aprobada
      description: Fecha futura con zona horaria. Usar el id aprobado; no regenerar.
      x-openai-isConsequential: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado real de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publicacion'
        '400':
          description: Datos inválidos
        '409':
          description: Versión desactualizada, sin aprobación u operación ocupada
        '502':
          description: Resultado incierto; consultar antes de repetir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - publication_id
              - revision
              - scheduled_at
              properties:
                publication_id:
                  type: integer
                  minimum: 1
                revision:
                  type: integer
                  minimum: 1
                scheduled_at:
                  type: string
                  format: date-time
    get:
      operationId: listarPublicacionesInstagram
      summary: Listar publicaciones de Instagram
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - borrador
          - aprobada
          - programada
          - procesando
          - publicando
          - publicada
          - revision
          - error
          - cancelada
      - name: limite
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: before_id
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Más recientes primero; continuar con next_before_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicaciones:
                    type: array
                    items:
                      $ref: '#/components/schemas/Publicacion'
                  next_before_id:
                    type:
                    - string
                    - 'null'
  /api/instagram/programaciones/{id}/publicar:
    post:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      operationId: publicarProgramacionInstagram
      summary: Publicar una programación aprobada
      description: Comparte reserva con el cron.
      x-openai-isConsequential: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado real de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publicacion'
        '400':
          description: Datos inválidos
        '409':
          description: Versión desactualizada, sin aprobación u operación ocupada
        '502':
          description: Resultado incierto; consultar antes de repetir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - revision
              properties:
                revision:
                  type: integer
                  minimum: 1
  /api/instagram/borradores:
    post:
      operationId: crearBorradorInstagram
      summary: Guardar una pieza para revisión
      description: No publica. Mostrar imagen y copy con id y revision antes de aprobar.
      x-openai-isConsequential: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado real de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publicacion'
        '400':
          description: Datos inválidos
        '409':
          description: Versión desactualizada, sin aprobación u operación ocupada
        '502':
          description: Resultado incierto; consultar antes de repetir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request_id
              - image_id
              - caption
              properties:
                request_id:
                  type: string
                  minLength: 16
                  maxLength: 100
                  pattern: ^[a-zA-Z0-9_-]+$
                  description: Clave única por pedido. Reutilizar clave y datos ante
                    reintentos; no crear otra ante timeout.
                image_id:
                  type: integer
                  minimum: 1
                caption:
                  type: string
                  maxLength: 2200
  /api/instagram/programaciones/{id}:
    get:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      operationId: consultarPublicacionInstagram
      summary: Consultar una pieza y su estado exacto
      description: Preferir consulta por id ante timeout.
      x-openai-isConsequential: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado real de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publicacion'
        '400':
          description: Datos inválidos
        '409':
          description: Versión desactualizada, sin aprobación u operación ocupada
        '502':
          description: Resultado incierto; consultar antes de repetir
    patch:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      operationId: editarBorradorInstagram
      summary: Editar pieza e invalidar aprobación
      description: Retira programación y aumenta revision. Mostrar nuevamente para
        aprobar.
      x-openai-isConsequential: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado real de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publicacion'
        '400':
          description: Datos inválidos
        '409':
          description: Versión desactualizada, sin aprobación u operación ocupada
        '502':
          description: Resultado incierto; consultar antes de repetir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - revision
              - image_id
              - caption
              properties:
                revision:
                  type: integer
                  minimum: 1
                image_id:
                  type: integer
                  minimum: 1
                caption:
                  type: string
                  maxLength: 2200
  /api/instagram/programaciones/{id}/aprobar:
    post:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      operationId: aprobarPublicacionInstagram
      summary: Registrar aprobación explícita de una versión
      description: Solo después de mostrar imagen y copy exactos y recibir aprobación
        del usuario. Un pedido inicial de creación no es aprobación.
      x-openai-isConsequential: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado real de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publicacion'
        '400':
          description: Datos inválidos
        '409':
          description: Versión desactualizada, sin aprobación u operación ocupada
        '502':
          description: Resultado incierto; consultar antes de repetir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - revision
              - confirmacion
              properties:
                revision:
                  type: integer
                  minimum: 1
                confirmacion:
                  type: boolean
                  enum:
                  - true
  /api/instagram/programaciones/{id}/cancelar:
    post:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      operationId: cancelarPublicacionInstagram
      summary: Cancelar antes de iniciar publicación
      description: No permite cancelar operaciones en curso.
      x-openai-isConsequential: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado real de la operación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publicacion'
        '400':
          description: Datos inválidos
        '409':
          description: Versión desactualizada, sin aprobación u operación ocupada
        '502':
          description: Resultado incierto; consultar antes de repetir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - revision
              properties:
                revision:
                  type: integer
                  minimum: 1
  /api/instagram/programaciones/{id}/verificar:
    post:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      operationId: verificarResultadoInstagram
      summary: Consultar un resultado incierto en Instagram
      description: No reenvía. Marca publicada solo si el contenedor devuelve PUBLISHED.
      x-openai-isConsequential: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estado real de la operación
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicacion:
                    $ref: '#/components/schemas/Publicacion'
                  container_status:
                    type: string
                  requiere_revision:
                    type: boolean
                  verificado_en_instagram:
                    type: boolean
                  status:
                    type: string
        '400':
          description: Datos inválidos
        '409':
          description: Versión desactualizada, sin aprobación u operación ocupada
        '502':
          description: Resultado incierto; consultar antes de repetir
  /api/imagenes/{id}/textos:
    post:
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      operationId: editarTextosImagenMarketing
      summary: Crear otra versión usando el mismo fondo
      description: No consume Cloudflare. Solo imágenes nuevas que conservan fondo.
        Devuelve otra URL y requiere nueva aprobación.
      x-openai-isConsequential: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Imagen y URL pública
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  imagen:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        format: uri
                      size:
                        type: string
                      model:
                        type: string
                      quality:
                        type: string
        '201':
          description: Imagen y URL pública
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  imagen:
                    type: object
                    properties:
                      id:
                        type: string
                      url:
                        type: string
                        format: uri
                      size:
                        type: string
                      model:
                        type: string
                      quality:
                        type: string
        '409':
          description: Intento pendiente/fallido o imagen antigua sin fondo
        '422':
          description: Texto demasiado largo para composición legible
        '502':
          description: Generación no confirmada; revisar antes de repetir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request_id
              - title
              properties:
                request_id:
                  type: string
                  minLength: 16
                  maxLength: 100
                  pattern: ^[a-zA-Z0-9_-]+$
                  description: Clave única por pedido. Reutilizar clave y datos ante
                    reintentos; no crear otra ante timeout.
                title:
                  type: string
                  maxLength: 180
                subtitle:
                  type: string
                  maxLength: 320
                bullets:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 140
                cta:
                  type: string
                  maxLength: 80
                  default: Pedí información
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Estado:
      type: string
      enum:
      - nuevo
      - contactado
      - respondio
      - interesado
      - piloto
      - descartado
    Canal:
      type: string
      enum:
      - instagram
      - facebook
      - whatsapp
      - email
      - telefono
      - linkedin
      - web
      - visita
      - otro
    NuevoProspecto:
      type: object
      additionalProperties: false
      required:
      - nombre_consultorio
      properties:
        nombre_consultorio:
          type: string
          maxLength: 200
        ciudad:
          type: string
          maxLength: 120
        contacto_nombre:
          type: string
          maxLength: 160
        canal:
          $ref: '#/components/schemas/Canal'
        contacto:
          type: string
          maxLength: 255
        fuente:
          type: string
          maxLength: 255
        estado:
          $ref: '#/components/schemas/Estado'
        notas:
          type: string
          maxLength: 4000
        proxima_accion:
          type: string
          maxLength: 255
        fecha_proxima_accion:
          type: string
          format: date-time
    ActualizacionProspecto:
      type: object
      additionalProperties: false
      properties:
        ciudad:
          type: string
          maxLength: 120
        contacto_nombre:
          type: string
          maxLength: 160
        canal:
          $ref: '#/components/schemas/Canal'
        contacto:
          type: string
          maxLength: 255
        fuente:
          type: string
          maxLength: 255
        estado:
          $ref: '#/components/schemas/Estado'
        notas:
          type: string
          maxLength: 4000
        proxima_accion:
          type: string
          maxLength: 255
        fecha_proxima_accion:
          type: string
          format: date-time
    Publicacion:
      type: object
      properties:
        id:
          type: string
        image_url:
          type: string
        caption:
          type: string
        revision:
          type: integer
          minimum: 1
        approved_revision:
          type:
          - integer
          - 'null'
        status:
          type: string
          enum:
          - borrador
          - aprobada
          - programada
          - procesando
          - publicando
          - publicada
          - revision
          - error
          - cancelada
        scheduled_at:
          type:
          - string
          - 'null'
          format: date-time
        target_account_id:
          type:
          - string
          - 'null'
        instagram_media_id:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
