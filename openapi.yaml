openapi: 3.1.0
info:
  title: Sismed Marketing API
  version: 2.0.0
  description: >
    API para gestionar prospectos comerciales y publicaciones de Instagram de Sismed.
    Nunca debe almacenar datos clínicos ni datos de pacientes.
servers:
  - url: https://sismed-marketing-action.onrender.com
paths:
  /api/prospectos:
    post:
      operationId: crearProspecto
      summary: Registrar un nuevo consultorio potencial
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoProspecto' }
      responses:
        '201': { description: Prospecto creado }
        '400': { description: Datos inválidos }
    get:
      operationId: listarProspectos
      summary: Listar prospectos comerciales
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/Estado' }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Lista de prospectos }

  /api/prospectos/{id}:
    patch:
      operationId: actualizarProspecto
      summary: Actualizar un prospecto
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizacionProspecto' }
      responses:
        '200': { description: Prospecto actualizado }

  /api/instagram/status:
    get:
      operationId: verificarInstagram
      summary: Verificar que la cuenta de Instagram y el token estén conectados
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Estado de conexión de Instagram }

  /api/instagram/publicar-imagen:
    post:
      operationId: publicarImagenInstagram
      summary: Publicar inmediatamente una imagen aprobada en Instagram
      description: >
        Usar solamente cuando el usuario haya pedido explícitamente publicar ahora.
        image_url debe ser una URL HTTPS pública accesible por Meta.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_url]
              properties:
                image_url:
                  type: string
                  format: uri
                caption:
                  type: string
                  maxLength: 2200
      responses:
        '201': { description: Imagen publicada }
        '400': { description: Datos inválidos }
        '502': { description: Error de Instagram }

  /api/instagram/programaciones:
    post:
      operationId: programarPublicacionInstagram
      summary: Programar una imagen aprobada para Instagram
      description: >
        Guarda la publicación para procesarla en la fecha indicada.
        No usar sin aprobación explícita del usuario.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_url, scheduled_at]
              properties:
                image_url:
                  type: string
                  format: uri
                caption:
                  type: string
                  maxLength: 2200
                scheduled_at:
                  type: string
                  format: date-time
                  description: Fecha y hora ISO 8601 con zona horaria.
      responses:
        '201': { description: Publicación programada }
    get:
      operationId: listarPublicacionesInstagram
      summary: Listar publicaciones de Instagram guardadas o programadas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [programada, procesando, publicada, error]
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Lista de publicaciones }

  /api/instagram/programaciones/{id}/publicar:
    post:
      operationId: publicarProgramacionInstagram
      summary: Publicar manualmente una programación existente
      description: Usar solo con aprobación explícita del usuario.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Publicación realizada }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Estado:
      type: string
      enum: [nuevo, contactado, respondio, interesado, piloto, descartado]

    Canal:
      type: string
      enum: [instagram, facebook, whatsapp, email, telefono, linkedin, web, visita, otro]

    NuevoProspecto:
      type: object
      additionalProperties: false
      required: [nombre_consultorio]
      properties:
        nombre_consultorio: { type: string, maxLength: 200 }
        ciudad: { type: string, maxLength: 120 }
        contacto_nombre: { type: string, maxLength: 160 }
        canal: { $ref: '#/components/schemas/Canal' }
        contacto: { type: string, maxLength: 255 }
        fuente: { type: string, maxLength: 255 }
        estado: { $ref: '#/components/schemas/Estado' }
        notas:
          type: string
          maxLength: 4000
          description: Solo notas comerciales.
        proxima_accion: { type: string, maxLength: 255 }
        fecha_proxima_accion: { type: string, format: date-time }

    ActualizacionProspecto:
      type: object
      additionalProperties: false
      properties:
        ciudad: { type: string, maxLength: 120 }
        contacto_nombre: { type: string, maxLength: 160 }
        canal: { $ref: '#/components/schemas/Canal' }
        contacto: { type: string, maxLength: 255 }
        fuente: { type: string, maxLength: 255 }
        estado: { $ref: '#/components/schemas/Estado' }
        notas: { type: string, maxLength: 4000 }
        proxima_accion: { type: string, maxLength: 255 }
        fecha_proxima_accion: { type: string, format: date-time }
