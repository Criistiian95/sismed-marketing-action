openapi: 3.1.0
info:
  title: Sismed Marketing API
  version: 3.4.0
  description: >
    API para prospectos, imágenes de marketing y publicaciones de Instagram de Sismed.
    Nunca debe almacenar datos clínicos ni datos de pacientes.
servers:
  - url: https://sismed-marketing-action.onrender.com
paths:
  /api/prospectos:
    post:
      operationId: crearProspecto
      summary: Registrar un nuevo consultorio potencial
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoProspecto' }
      responses:
        '201': { description: Prospecto creado }
    get:
      operationId: listarProspectos
      summary: Listar prospectos comerciales
      security: [{ bearerAuth: [] }]
      parameters:
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/Estado' }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Lista de prospectos }

  /api/prospectos/{id}:
    patch:
      operationId: actualizarProspecto
      summary: Actualizar un prospecto
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizacionProspecto' }
      responses:
        '200': { description: Prospecto actualizado }

  /api/imagenes/generar:
    post:
      operationId: generarImagenMarketing
      summary: Generar publicidad de Sismed con modo económico o premium y texto exacto
      description: >
        Genera el fondo visual con IA y agrega titular, subtítulo, beneficios y CTA
        de forma determinística. Devuelve una URL pública lista para Instagram.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt, title]
              properties:
                prompt:
                  type: string
                  maxLength: 2048
                  description: Descripción visual del fondo. No pedir texto dentro de la imagen.
                title:
                  type: string
                  maxLength: 180
                subtitle:
                  type: string
                  maxLength: 320
                bullets:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 140
                cta:
                  type: string
                  maxLength: 80
                  default: Escribinos por privado
                size:
                  type: string
                  default: 1024x1280
                  description: Formato 4:5 para Instagram.
                quality:
                  type: string
                  enum: [low, medium, high, auto]
                  default: high
                mode:
                  type: string
                  enum: [economy, premium]
                  default: economy
                  description: economy usa FLUX.1 Schnell; premium usa Lucid Origin.
      responses:
        '201': { description: Imagen generada y alojada }

  /api/imagenes:
    get:
      operationId: listarImagenesMarketing
      summary: Listar imágenes de marketing generadas
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Lista de imágenes }

  /api/instagram/status:
    get:
      operationId: verificarInstagram
      summary: Verificar conexión con Instagram
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Estado de conexión }

  /api/instagram/publicar-imagen:
    post:
      operationId: publicarImagenInstagram
      summary: Publicar inmediatamente una imagen aprobada
      description: Usar solo si el usuario pidió explícitamente publicar ahora.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_url]
              properties:
                image_url: { type: string, format: uri }
                caption: { type: string, maxLength: 2200 }
      responses:
        '201': { description: Imagen publicada }

  /api/instagram/programaciones:
    post:
      operationId: programarPublicacionInstagram
      summary: Programar una imagen pública existente
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image_url, scheduled_at]
              properties:
                image_url: { type: string, format: uri }
                caption: { type: string, maxLength: 2200 }
                scheduled_at:
                  type: string
                  format: date-time
      responses:
        '201': { description: Publicación programada }
    get:
      operationId: listarPublicacionesInstagram
      summary: Listar publicaciones de Instagram
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [programada, procesando, publicada, error]
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Lista de publicaciones }

  /api/instagram/generar-y-programar:
    post:
      operationId: generarYProgramarInstagram
      summary: Generar publicidad económica o premium con texto exacto y programarla en Instagram
      description: >
        Genera el fondo visual, agrega texto exacto en español, aloja la imagen
        públicamente y crea la programación de Instagram.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prompt, title, scheduled_at]
              properties:
                prompt:
                  type: string
                  maxLength: 2048
                  description: Descripción visual del fondo. No pedir texto dentro de la imagen.
                title:
                  type: string
                  maxLength: 180
                subtitle:
                  type: string
                  maxLength: 320
                bullets:
                  type: array
                  maxItems: 4
                  items:
                    type: string
                    maxLength: 140
                cta:
                  type: string
                  maxLength: 80
                  default: Escribinos por privado
                caption:
                  type: string
                  maxLength: 2200
                scheduled_at:
                  type: string
                  format: date-time
                size:
                  type: string
                  default: 1024x1280
                quality:
                  type: string
                  enum: [low, medium, high, auto]
                  default: high
                mode:
                  type: string
                  enum: [economy, premium]
                  default: economy
                  description: economy usa FLUX.1 Schnell; premium usa Lucid Origin.
      responses:
        '201': { description: Imagen generada y publicación programada }

  /api/instagram/programaciones/{id}/publicar:
    post:
      operationId: publicarProgramacionInstagram
      summary: Publicar manualmente una programación
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Publicación realizada }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Estado:
      type: string
      enum: [nuevo, contactado, respondio, interesado, piloto, descartado]

    Canal:
      type: string
      enum: [instagram, facebook, whatsapp, email, telefono, linkedin, web, visita, otro]

    NuevoProspecto:
      type: object
      additionalProperties: false
      required: [nombre_consultorio]
      properties:
        nombre_consultorio: { type: string, maxLength: 200 }
        ciudad: { type: string, maxLength: 120 }
        contacto_nombre: { type: string, maxLength: 160 }
        canal: { $ref: '#/components/schemas/Canal' }
        contacto: { type: string, maxLength: 255 }
        fuente: { type: string, maxLength: 255 }
        estado: { $ref: '#/components/schemas/Estado' }
        notas: { type: string, maxLength: 4000 }
        proxima_accion: { type: string, maxLength: 255 }
        fecha_proxima_accion: { type: string, format: date-time }

    ActualizacionProspecto:
      type: object
      additionalProperties: false
      properties:
        ciudad: { type: string, maxLength: 120 }
        contacto_nombre: { type: string, maxLength: 160 }
        canal: { $ref: '#/components/schemas/Canal' }
        contacto: { type: string, maxLength: 255 }
        fuente: { type: string, maxLength: 255 }
        estado: { $ref: '#/components/schemas/Estado' }
        notas: { type: string, maxLength: 4000 }
        proxima_accion: { type: string, maxLength: 255 }
        fecha_proxima_accion: { type: string, format: date-time }
